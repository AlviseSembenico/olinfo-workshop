<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title description">
  <title id="title">A tree in DFS order</title>
  <desc id="description">A rooted tree with five numbered nodes and DFS interval labels.</desc>
  <rect width="720" height="400" rx="24" fill="#f5f8fc"/>
  <g stroke="#40536d" stroke-width="8" stroke-linecap="round">
    <path d="M360 70 L190 170 M360 70 L530 170"/>
    <path d="M190 170 L115 300 M190 170 L285 300"/>
  </g>
  <g fill="#2457a6" stroke="#fff" stroke-width="6">
    <circle cx="360" cy="70" r="34"/>
    <circle cx="190" cy="170" r="34"/>
    <circle cx="530" cy="170" r="34"/>
    <circle cx="115" cy="300" r="34"/>
    <circle cx="285" cy="300" r="34"/>
  </g>
  <g fill="#fff" font-family="system-ui, sans-serif" font-size="27" font-weight="700" text-anchor="middle" dominant-baseline="central">
    <text x="360" y="70">1</text>
    <text x="190" y="170">2</text>
    <text x="530" y="170">5</text>
    <text x="115" y="300">3</text>
    <text x="285" y="300">4</text>
  </g>
  <g fill="#40536d" font-family="system-ui, sans-serif" font-size="18" text-anchor="middle">
    <text x="360" y="135">tin = 0</text>
    <text x="190" y="235">[1, 3]</text>
    <text x="530" y="235">tin = 4</text>
  </g>
</svg>
